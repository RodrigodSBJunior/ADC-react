spring.application.name=adc

server.port=3000
spring.datasource.url=jdbc:sqlserver://adcagendamento.mssql.somee.com:1433;databaseName=adcagendamento;integratedSecurity=false;encrypt=true;trustServerCertificate=true
spring.datasource.username=ADC
spring.datasource.password=adcagendamento
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.show_sql=true
spring.jpa.hibernate.naming.implicit-strategy=org.hibernate.boot.model.naming.ImplicitNamingStrategyLegacyJpaImpl
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.level.com.itb.inf2dm.adc=DEBUG

