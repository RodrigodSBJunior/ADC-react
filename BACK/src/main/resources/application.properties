spring.application.name=divulgai
server.port=8081

# Configuração do banco de dados SQL Server local
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=divulgai_db;encrypt=false;trustServerCertificate=true;integratedSecurity=false
spring.datasource.username=sa
spring.datasource.password=123456
spring.datasource.driverClassName=com.microsoft.sqlserver.jdbc.SQLServerDriver

# Configurações do JPA e Hibernate
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# Configurações Web
spring.web.resources.add-mappings=false
spring.mvc.throw-exception-if-no-handler-found=true